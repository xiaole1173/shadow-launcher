# Shadow Launcher 自建更新服务器 — nginx 参考配置
# 放置到 /etc/nginx/conf.d/update.conf（或站点配置），替换 server_name 与路径。
# 客户端访问:
#   检查接口  https://<域名>/update/latest.json   （UpdateManager API）
#   下载      https://<域名>/update/ShadowLauncher.exe / .zip（驿道下载，需 Range 断点）

server {
    listen 80;
    # listen 443 ssl;            # 有 HTTPS 证书时打开
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    server_name update.example.com;

    # 发布工具 output_dir 的内容上传到这里（latest.json / compat.json / exe / zip）
    root /var/www/update;
    index latest.json;

    location / {
        autoindex off;

        # 限速：峰值 200Mbps 下每连接限 5MB/s。
        # 单用户约 5s 下完增量、十几秒下完全量；同时几十人也顶得住，
        # 且不会把带宽全部占死影响服务器的其他服务。
        limit_rate 5m;
    }

    # 检查接口 JSON 压缩（体积几 KB，纯优化）
    location ~* \.json$ {
        gzip on;
        gzip_types application/json;
    }

    # 可选：更新文件目录禁止脚本执行（安全加固）
    location ~* \.(php|py|sh)$ {
        deny all;
    }
}
